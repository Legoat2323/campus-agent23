<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桂电校园助手</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: #1f6feb;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
    }
    header small { font-weight: 400; opacity: .8; margin-left: 8px; font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 76%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 3px;
    }
    .bubble.bot:empty::after {
      content: "思考中…";
      color: #999;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    #q {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    #q:focus { border-color: #1f6feb; }
    button {
      padding: 11px 22px;
      border: 0;
      border-radius: 8px;
      background: #1f6feb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { background: #9db8e8; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>桂电校园助手<small>新生报到 · 入学 · 校园生活</small></header>
  <div id="chat"></div>
  <form id="form">
    <input id="q" placeholder="例如：什么时候报到？快递点在哪里？" autocomplete="off">
    <button id="send">发送</button>
  </form>

  <script>
    const chatEl = document.getElementById('chat');
    const formEl = document.getElementById('form');
    const inputEl = document.getElementById('q');
    const sendEl = document.getElementById('send');

    // 每个页面一个会话 id，后端靠它区分别人的记忆
    const sessionId = 'sess_' + Math.random().toString(36).slice(2, 10);

    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();

      const question = inputEl.value.trim();
      if (!question) return;

      inputEl.value = '';
      addBubble(question, 'user');

      const bubble = addBubble('', 'bot');   // 先占位，再往里填字
      sendEl.disabled = true;

      try {
        const resp = await fetch('/chat_stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, query: question }),
        });

        if (!resp.ok) {
          bubble.textContent = '请求失败，HTTP ' + resp.status;
          return;
        }

        // ---- 核心：流式读取 ----
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // { stream: true } 保证多字节中文不会被截断
          buffer += decoder.decode(value, { stream: true });

          // SSE 事件之间用空行分隔
          const events = buffer.split('\n\n');
          buffer = events.pop();            // 最后一段可能不完整，留着下次拼

          for (const evt of events) {
            const line = evt.trim();
            if (!line.startsWith('data:')) continue;

            const text = line.slice(5).trimStart();   // 去掉 "data:" 前缀
            if (!text) continue;

            bubble.textContent += text;                // 追加 -> 打字机效果
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }
      } catch (err) {
        bubble.textContent = '出错了：' + err.message;
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
